<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview History</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="background-effects.css">
    <script>
        window.__clerk_publishable_key = 'YOUR_CLERK_PUBLISHABLE_KEY';
    </script>
    <script async crossorigin="anonymous" data-clerk-publishable-key="YOUR_CLERK_PUBLISHABLE_KEY" src="https://YOUR_CLERK_FRONTEND_API_DOMAIN/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
    <style>
        .history-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
        .history-item { background: var(--bg-surface); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-subtle); cursor: pointer; }
        .history-details { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); }
        .history-details.active { display: block; }
        .history-qa { display: flex; flex-direction: column; gap: 1rem; }
        .history-eval { margin-top: 2rem; }
        .role-bot { color: var(--primary); font-weight: bold; }
        .role-user { color: var(--text-primary); font-weight: bold; }
    </style>
</head>
<body>

<main class="home-container">
    <header class="home-header">
        <div>
            <p class="eyebrow"><a href="index.html" style="color: inherit; text-decoration: none;">← BACK TO HOME</a></p>
            <h1>Interview History</h1>
            <p class="home-subtitle">Review your past interviews and evaluations.</p>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <div id="auth-container"></div>
            <button type="button" id="themeToggle" class="theme-toggle">🌙 Dark</button>
        </div>
    </header>

    <section class="features-section">
        <p id="history-message" class="history-message" role="status" aria-live="polite"></p>
        <div id="history-container" class="history-list">
            <p>Loading history...</p>
        </div>
    </section>
</main>

<div
    id="history-delete-dialog"
    class="history-delete-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="history-delete-title"
    aria-describedby="history-delete-warning"
    hidden
>
    <section class="history-delete-dialog">
        <h2 id="history-delete-title">Delete Interview History?</h2>
        <p id="history-delete-warning">Are you sure you want to delete this interview?</p>
        <dl class="history-delete-details">
            <div><dt>Target Role:</dt><dd id="delete-history-role"></dd></div>
            <div><dt>Date &amp; Time:</dt><dd id="delete-history-date"></dd></div>
            <div><dt>Duration:</dt><dd id="delete-history-duration"></dd></div>
        </dl>
        <p class="history-delete-warning">This action cannot be undone.</p>
        <p id="history-delete-error" class="history-delete-error" role="alert"></p>
        <div class="history-delete-actions">
            <button type="button" id="cancel-history-delete" class="feature-button">Cancel</button>
            <button type="button" id="confirm-history-delete" class="history-delete-button">Delete</button>
        </div>
    </section>
</div>

<script src="auth.js"></script>
<script src="history.js"></script>
<script src="script.js"></script>
<script src="background-effects.js"></script>
</body>
</html>
